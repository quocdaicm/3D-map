name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Giải nén zip dự án
        run: |
          set -e
          ZIP=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD 2>/dev/null | grep -E '^(inbox/)?[^/]+\.zip$' | head -1 || true)
          if [ -z "$ZIP" ]; then
            ZIP=$(ls -t inbox/*.zip *.zip 2>/dev/null | head -1 || true)
          fi
          if [ -z "$ZIP" ]; then
            echo "Không thấy file .zip nào trong repo"
            exit 1
          fi
          echo "Dùng file: $ZIP"
          rm -rf _src && mkdir _src
          unzip -q "$ZIP" -x '__MACOSX/*' '*.DS_Store' -d _src || true
          SRC=_src
          while [ "$(ls -A "$SRC" | wc -l | tr -d ' ')" = "1" ] && [ -d "$SRC/$(ls -A "$SRC")" ]; do
            SRC="$SRC/$(ls -A "$SRC")"
          done
          echo "Thư mục project: $SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài thư viện và build web
        working-directory: ${{ env.SRC }}
        run: |
          npm install
          npm run build

      - name: Tạo project iOS (Capacitor)
        working-directory: ${{ env.SRC }}
        run: |
          bash scripts/ios-setup.sh

      - name: Build .ipa chưa ký
        working-directory: ${{ env.SRC }}/ios/App
        run: |
          set -eo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee "$GITHUB_WORKSPACE/out/build.log"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/out/Map3D.ipa" Payload

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: out/
          if-no-files-found: warn
